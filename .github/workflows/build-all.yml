name: build-debs

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Descobre todos os diretórios em packages/
  # ------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          PKGS=$(ls -d packages/*/ | xargs -n 1 basename | jq -R . | jq -s -c .)
          echo "packages=${PKGS}" >> $GITHUB_OUTPUT

  # ------------------------------------------------------------------
  # JOB 2: Checa versões em paralelo e filtra quem precisa de build
  # ------------------------------------------------------------------
  check-versions:
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
      has_updates: ${{ steps.filter.outputs.has_updates }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4

      - name: Validar versão do pacote
        id: check
        run: |
          PKG="${{ matrix.package }}"
          PKG_DIR="packages/${PKG}"
          VERSION_FILE="versions/${PKG}.txt"
          
          CURRENT=""
          [ -f "$VERSION_FILE" ] && CURRENT=$(cat "$VERSION_FILE")

          chmod +x "${PKG_DIR}/check.sh"
          LATEST=$("${PKG_DIR}/check.sh")

          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ]; then
            echo "Nova versão detectada para ${PKG}: ${LATEST} (Atual: ${CURRENT})"
            
            # Salva o resultado em um arquivo temporário de artefato
            mkdir -p /tmp/updates
            echo "{\"package\": \"${PKG}\", \"version\": \"${LATEST}\"}" > "/tmp/updates/${PKG}.json"
          else
            echo "${PKG} já está na versão mais recente (${CURRENT})."
          fi

      - name: Salvar registro de atualização
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.package }}
          path: /tmp/updates/*.json
          retention-days: 1
          if-no-files-found: ignore

  # Step consolidado para gerar a matriz final dos programas que mudaram
  prepare-builds:
    needs: check-versions
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
      has_updates: ${{ steps.filter.outputs.has_updates }}
    steps:
      - name: Baixar registros de atualização
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-updates
          pattern: update-*
          merge-multiple: true
        continue-on-error: true

      - name: Gerar matriz apenas para pacotes desatualizados
        id: filter
        run: |
          if [ -d "/tmp/all-updates" ] && [ "$(ls -A /tmp/all-updates/*.json 2>/dev/null)" ]; then
            # Agrupa os JSONs individuais em um único array JSON
            MATRIX=$(jq -s -c . /tmp/all-updates/*.json)
            echo "build_matrix=${MATRIX}" >> $GITHUB_OUTPUT
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Pacotes pendentes de build: ${MATRIX}"
          else
            echo "build_matrix=[]" >> $GITHUB_OUTPUT
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "Nenhum pacote precisa de atualização."
          fi

  # ------------------------------------------------------------------
  # JOB 3: Compila e faz deploy APENAS dos pacotes desatualizados
  # ------------------------------------------------------------------
  build-and-deploy:
    needs: prepare-builds
    if: needs.prepare-builds.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-builds.outputs.build_matrix) }}

    steps:
      - name: Checkout repositório principal
        uses: actions/checkout@v4

      - name: Configurar ambiente e Git
        run: |
          apt-get update && apt-get install -y curl git equivs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Compilar pacote
        run: |
          PKG="${{ matrix.package }}"
          LATEST="${{ matrix.version }}"
          PKG_DIR="packages/${PKG}"
          
          mkdir -p /tmp/debs versions
          chmod +x "${PKG_DIR}/build.sh"

          WORK_DIR=$(mktemp -d)
          (cd "$WORK_DIR" && "${GITHUB_WORKSPACE}/${PKG_DIR}/build.sh" "$LATEST" "/tmp/debs")
          
          # Atualiza a versão local
          echo "$LATEST" > "versions/${PKG}.txt"

      - name: Clonar debian_repo
        uses: actions/checkout@v4
        with:
          repository: victor-oliveira1/debian_repo
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
          path: debian_repo

      - name: Atualizar debian_repo com arquivo .deb
        working-directory: debian_repo
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/debian_repo"
          mkdir -p deb/
          cp /tmp/debs/*.deb deb/

          git add deb/*.deb
          if ! git diff --cached --quiet; then
            git commit -m "chore(${{ matrix.package }}): add deb for version ${{ matrix.version }}"
            git push
          fi

      - name: Push do arquivo de versão local
        working-directory: ${{ github.workspace }}
        run: |
          git add "versions/${{ matrix.package }}.txt"
          if ! git diff --cached --quiet; then
            git commit -m "chore(${{ matrix.package }}): update version file to ${{ matrix.version }} [skip ci]"
            git push
          fi
