name: build-matrix-debs

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # 1. Busca os programas (diretórios em packages)
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          PKGS=$(ls -d packages/*/ | xargs -n 1 basename | jq -R . | jq -s -c .)
          echo "packages=${PKGS}" >> $GITHUB_OUTPUT

  # 2. Executa a matriz para cada programa
  build-and-deploy:
    needs: discover
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    strategy:
      fail-fast: false
      matrix:
        package: ${{ json(needs.discover.outputs.packages) }}

    steps:
      - name: Checkout repositório principal
        uses: actions/checkout@v4

      - name: Configurar ambiente e Git
        run: |
          apt-get update && apt-get install -y curl git equivs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Executa o check e compila (se houver versão nova)
      - name: Checar versão e Compilar
        id: build
        run: |
          PKG="${{ matrix.package }}"
          PKG_DIR="packages/${PKG}"
          VERSION_FILE="versions/${PKG}.txt"
          
          mkdir -p /tmp/debs versions
          
          CURRENT=""
          [ -f "$VERSION_FILE" ] && CURRENT=$(cat "$VERSION_FILE")

          chmod +x "${PKG_DIR}/check.sh" "${PKG_DIR}/build.sh"
          LATEST=$("${PKG_DIR}/check.sh")

          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ]; then
            echo "Nova versão encontrada para ${PKG}: ${LATEST}"
            WORK_DIR=$(mktemp -d)
            
            # Compila o programa
            (cd "$WORK_DIR" && "${GITHUB_WORKSPACE}/${PKG_DIR}/build.sh" "$LATEST" "/tmp/debs")
            
            # Atualiza a versão local apenas em caso de sucesso no build
            echo "$LATEST" > "$VERSION_FILE"
            echo "updated=true" >> $GITHUB_OUTPUT
            echo "latest_version=${LATEST}" >> $GITHUB_OUTPUT
          else
            echo "${PKG} já está atualizado (${CURRENT})."
            echo "updated=false" >> $GITHUB_OUTPUT
          fi

      # Clona o repositório debian_repo
      - name: Clonar debian_repo
        if: steps.build.outputs.updated == 'true'
        uses: actions/checkout@v4
        with:
          repository: victor-oliveira1/debian_repo
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
          path: debian_repo

      # Atualiza o repositório debian_repo com os arquivos .deb
      - name: Atualizar debian_repo com arquivo .deb
        if: steps.build.outputs.updated == 'true'
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/debian_repo"
          mkdir -p debian_repo/deb/
          cp /tmp/debs/*.deb debian_repo/deb/

          cd debian_repo
          git add deb/*.deb
          if ! git diff --cached --quiet; then
            git commit -m "chore(${{ matrix.package }}): add deb for version ${{ steps.build.outputs.latest_version }}"
            git push
          fi

      # Atualiza o arquivo de versão local do programa
      - name: Push do arquivo de versão local
        if: steps.build.outputs.updated == 'true'
        run: |
          PKG="${{ matrix.package }}"
          git add "versions/${PKG}.txt"
          if ! git diff --cached --quiet; then
            git commit -m "chore(${PKG}): update version file to ${{ steps.build.outputs.latest_version }} [skip ci]"
            git push
          fi
