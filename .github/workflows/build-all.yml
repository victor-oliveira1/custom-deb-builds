name: build

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set-matrix.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          PKGS=$(ls -d packages/*/ | xargs -n 1 basename | jq -R . | jq -s -c .)
          echo "packages=${PKGS}" >> $GITHUB_OUTPUT

  check-versions:
    needs: discover
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
      has_updates: ${{ steps.filter.outputs.has_updates }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate package version
        id: check
        run: |
          PKG="${{ matrix.package }}"
          PKG_DIR="packages/${PKG}"
          VERSION_FILE="versions/${PKG}.txt"

          CURRENT=""
          [ -f "$VERSION_FILE" ] && CURRENT=$(cat "$VERSION_FILE")

          chmod +x "${PKG_DIR}/check.sh"
          LATEST=$("${PKG_DIR}/check.sh")

          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ]; then
            echo "Nova versão detectada para ${PKG}: ${LATEST} (Atual: ${CURRENT})"

            mkdir -p /tmp/updates
            echo "{\"package\": \"${PKG}\", \"version\": \"${LATEST}\"}" > "/tmp/updates/${PKG}.json"
          else
            echo "${PKG} já está na versão mais recente (${CURRENT})."
          fi

      - name: Save update data
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.package }}
          path: /tmp/updates/*.json
          retention-days: 1
          if-no-files-found: ignore

  prepare-builds:
    needs: check-versions
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.filter.outputs.build_matrix }}
      has_updates: ${{ steps.filter.outputs.has_updates }}
    steps:
      - name: Get update data
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-updates
          pattern: update-*
          merge-multiple: true
        continue-on-error: true

      - name: Generate matrix for updates
        id: filter
        run: |
          if [ -d "/tmp/all-updates" ] && [ "$(ls -A /tmp/all-updates/*.json 2>/dev/null)" ]; then
            MATRIX=$(jq -s -c . /tmp/all-updates/*.json)
            echo "build_matrix=${MATRIX}" >> $GITHUB_OUTPUT
            echo "has_updates=true" >> $GITHUB_OUTPUT
            echo "Updates found for package: ${MATRIX}"
          else
            echo "build_matrix=[]" >> $GITHUB_OUTPUT
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "No updates found."
          fi

  build-and-deploy:
    needs: prepare-builds
    if: needs.prepare-builds.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:stable
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-builds.outputs.build_matrix) }}

    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*'

      - name: Main repo checkout
        uses: actions/checkout@v4

      - name: Build package
        run: |
          PKG="${{ matrix.package }}"
          LATEST="${{ matrix.version }}"
          PKG_DIR="packages/${PKG}"

          mkdir -p /tmp/debs versions
          chmod +x "${PKG_DIR}/build.sh"

          WORK_DIR=$(mktemp -d)
          (cd "$WORK_DIR" && "${GITHUB_WORKSPACE}/${PKG_DIR}/build.sh" "$LATEST" "/tmp/debs")

          echo "$LATEST" > "${GITHUB_WORKSPACE}/versions/${PKG}.txt"

      - name: Checkout debian_repo
        uses: actions/checkout@v4
        with:
          repository: victor-oliveira1/debian_repo
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
          path: debian_repo

      - name: Copy deb file to debian_repo
        run: |
          mkdir -p debian_repo/deb/
          cp /tmp/debs/*.deb debian_repo/deb/

      - name: Commit deb file to debian_repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: debian_repo
          commit_message: "chore(${{ matrix.package }}): add deb for version ${{ matrix.version }}"
          file_pattern: 'deb/*.deb'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Update package version on repo
        env:
          PKG_NAME: ${{ matrix.package }}
          PKG_VER: ${{ matrix.version }}
        run: |
          mkdir -p versions
          cat <<EOF > "versions/${PKG_NAME}.txt"
          ${PKG_VER}
          EOF

      - name: Commit the new version file to main repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: .
          commit_message: "chore(${{ matrix.package }}): update version file to ${{ matrix.version }} [skip ci]"
          file_pattern: 'versions/*.txt'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
