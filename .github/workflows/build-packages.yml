name: build-packages-modular

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # 1. Mapeia os pacotes dentro da pasta /packages
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          DIRS=$(ls -d packages/*/ | jq -R . | jq -s -c .)
          echo "matrix={\"package_dir\":$DIRS}" >> $GITHUB_OUTPUT

  # 2. Executa a checagem usando o check.sh customizado
  check:
    needs: matrix-prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-prep.outputs.matrix) }}
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      app_dir: ${{ steps.check.outputs.app_dir }}
      app_name: ${{ steps.check.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          PKG_DIR="${{ matrix.package_dir }}"
          APP_NAME=$(basename "$PKG_DIR")
          
          echo "app_dir=$PKG_DIR" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          
          VERSION_FILE="versions/${APP_NAME}.txt"
          CURRENT=""
          if [ -f "$VERSION_FILE" ]; then
            CURRENT=$(cat "$VERSION_FILE")
          fi

          chmod +x "${PKG_DIR}/check.sh"
          LATEST=$("${PKG_DIR}/check.sh")

          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ] && [ "$LATEST" != "null" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

  # 3. Compilação e Commit automatizado via GitHub Actions
  build:
    needs: [matrix-prep, check]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:stable

    steps:
      - uses: actions/checkout@v4

      # Configuração centralizada de SSH para as Actions usarem
      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Compilar Pacote
        run: |
          apt-get update
          apt-get install -y git equivs yq wget curl
          
          PKG_DIR="${{ needs.check.outputs.app_dir }}"
          APP_NAME="${{ needs.check.outputs.app_name }}"
          VERSION="${{ needs.check.outputs.version }}"
          CLEAN_VERSION="${VERSION#v}"
          
          if [ -f "${PKG_DIR}/config.yml" ]; then
            wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
            chmod +x /usr/bin/yq
            DEPS=$(yq -r '.deps // empty' "${PKG_DIR}/config.yml")
            if [ -n "$DEPS" ]; then
              apt-get install -y $DEPS
            fi
          fi

          WORK_DIR=$(mktemp -d)
          PREFIX_DIR="${WORK_DIR}/prefix"
          mkdir -p "$PREFIX_DIR"

          chmod +x "${PKG_DIR}/build.sh"
          cd "$WORK_DIR"
          "${GITHUB_WORKSPACE}/${PKG_DIR}/build.sh" "$VERSION" "$PREFIX_DIR"
          
          cd "$WORK_DIR"
          cp "${GITHUB_WORKSPACE}/${PKG_DIR}/debian.control" control.template
          
          FILES_LIST=""
          if [ -f "build_src/build/install_manifest.txt" ]; then
            FILES_LIST=$(while read L; do D=${L%/*}; echo " ./prefix$L $D/"; done < build_src/build/install_manifest.txt)
          fi

          sed "s/__VERSION__/${CLEAN_VERSION}/g" control.template > package.control
          
          if [ -n "$FILES_LIST" ]; then
            echo "Files:${FILES_LIST}" >> package.control
          fi

          DEB_BUILD_OPTIONS="nostrip nodwz" equivs-build package.control
          
          mkdir -p /tmp/debs
          cp *.deb /tmp/debs/

      # Checkout do Repositório Debian via SSH
      - name: Checkout Repositório Debian
        uses: actions/checkout@v4
        with:
          repository: victor-oliveira1/debian_repo
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          path: debian_repo

      - name: Atualizar Índices APT
        run: |
          apt-get install -y apt-utils dpkg-dev gzip
          cp /tmp/debs/*.deb debian_repo/deb/
          cd debian_repo
          dpkg-scanpackages . /dev/null > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

      # Action para realizar commit e push das alterações no repositório Debian
      - name: Auto Commit - Repositório Debian
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: debian_repo
          commit_message: "chore: add package ${{ needs.check.outputs.app_name }} ${{ needs.check.outputs.version }}"
          file_pattern: 'deb/*.deb Packages* Release'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Atualizar arquivo de versão local
        run: |
          mkdir -p versions
          echo "${{ needs.check.outputs.version }}" > "versions/${{ needs.check.outputs.app_name }}.txt"

      # Action para realizar commit e push do arquivo de versão no repositório local
      - name: Auto Commit - Versão Local
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update ${{ needs.check.outputs.app_name }} version to ${{ needs.check.outputs.version }} [skip ci]"
          file_pattern: 'versions/*.txt'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
