name: build-nchat-deb

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - id: check
        name: Check latest release
        run: |
          CURRENT=""
          if [ -f version.txt ]; then
            CURRENT=$(cat version.txt)
          fi

          #LATEST=$(curl -s https://api.github.com/repos/d99kris/nchat/releases/latest | jq -r .tag_name)
          LATEST=$(curl -s https://github.com/d99kris/nchat/releases.atom | grep -oP '(?<=/tag/)[^"]+' | head -n 1)

          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ] && [ "$LATEST" != "null" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
            echo "$LATEST" > version.txt
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

      - name: Auto commit version file update
        if: steps.check.outputs.build == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update nchat version to ${{ steps.check.outputs.version }} [skip ci]"
          file_pattern: 'version.txt'

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:stable

    steps:
      - name: Build and create deb package
        run: |
          apt-get update
          apt-get install -y git sudo lsb-release equivs golang libpng-dev libx11-dev libxcb1-dev

          git clone https://github.com/d99kris/nchat
          cd nchat
          
          git checkout "${{ needs.check.outputs.version }}"
          VERSION="${{ needs.check.outputs.version }}"

          ./make.sh deps -y
          NCHAT_CMAKEARGS="-DCMAKE_INSTALL_PREFIX=/usr" ./make.sh build --no-telegram
          cd build
          make install DESTDIR=./prefix

          cat <<EOF1 > nchat.control
          Section: net
          Priority: optional
          Standards-Version: 3.9.2

          Package: nchat
          Version: ${VERSION#v}
          Maintainer: Victor Oliveira <victor.oliveira@gmx.com>
          Architecture: amd64
          Depends: libreadline8, libssl3, libncursesw6, libsqlite3-0, libmagic1, libxcb1
          Files:$(while read L; do D=${L%/*}; echo " ./prefix$L $D/"; done < install_manifest.txt)
          Description: Terminal-based Telegram / WhatsApp client
           nchat is a terminal-based chat client with support for 
           Telegram and WhatsApp. It features a modern ncurses UI.
          EOF1

          DEB_BUILD_OPTIONS="nostrip nodwz" equivs-build nchat.control

      - name: Checkout Debian repository
        uses: actions/checkout@v4
        with:
          repository: victor-oliveira1/debian_repo
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
          path: debian_repo

      - name: Update Debian repository indices
        run: |
          apt-get install -y apt-utils dpkg-dev gzip
          cp nchat/build/nchat*.deb debian_repo/deb/
          cd debian_repo
          dpkg-scanpackages . /dev/null > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

      - name: Auto commit Debian repository changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: debian_repo
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
          commit_message: "chore: add nchat package ${{ needs.check.outputs.version }}"
          file_pattern: 'deb/nchat*.deb Packages* Release'
