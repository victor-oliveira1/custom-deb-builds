name: build-all-debs

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  # 1. Mapeia todos os YAMLs da pasta recipes
  matrix-prep:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          FILES=$(ls .github/recipes/*.yml | jq -R . | jq -s -c .)
          echo "matrix={\"recipe\":$FILES}" >> $GITHUB_OUTPUT

  # 2. Verifica a versão mais recente para cada aplicativo
  check:
    needs: matrix-prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix-prep.outputs.matrix) }}
    outputs:
      build: ${{ steps.check.outputs.build }}
      version: ${{ steps.check.outputs.version }}
      app_name: ${{ steps.check.outputs.app_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse YML e Checar Release
        id: check
        run: |
          sudo apt-get update && sudo apt-get install -y yq
          
          RECIPE="${{ matrix.recipe }}"
          APP_NAME=$(yq e '.name' "$RECIPE")
          REPO=$(yq e '.repo' "$RECIPE")
          
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          
          VERSION_FILE="versions/${APP_NAME}.txt"
          CURRENT=""
          if [ -f "$VERSION_FILE" ]; then
            CURRENT=$(cat "$VERSION_FILE")
          fi

          LATEST=$(curl -s "https://github.com/${REPO}/releases.atom" | grep -oP '(?<=/tag/)[^"]+' | head -n 1)

          if [ "$CURRENT" != "$LATEST" ] && [ -n "$LATEST" ] && [ "$LATEST" != "null" ]; then
            echo "build=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST" >> $GITHUB_OUTPUT
          else
            echo "build=false" >> $GITHUB_OUTPUT
          fi

  # 3. Compila o pacote caso precise atualizar
  build:
    needs: [matrix-prep, check]
    # Filtra apenas a matriz onde build foi true
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    container:
      image: debian:stable

    steps:
      - uses: actions/checkout@v4

      - name: Compilar Pacote
        run: |
          apt-get update
          apt-get install -y git sudo lsb-release equivs jq yq
          
          RECIPE=".github/recipes/${{ needs.check.outputs.app_name }}.yml"
          
          NAME=$(yq e '.name' "$RECIPE")
          REPO=$(yq e '.repo' "$RECIPE")
          DEPS=$(yq e '.deps' "$RECIPE")
          DEB_DEPENDS=$(yq e '.deb_depends' "$RECIPE")
          BUILD_CMD=$(yq e '.build_cmd' "$RECIPE")
          DESC=$(yq e '.description' "$RECIPE")
          VERSION="${{ needs.check.outputs.version }}"
          
          # Instala dependências especificadas no YAML
          apt-get install -y $DEPS
          
          # Clona o repositório do app
          git clone "https://github.com/${REPO}" build_src
          cd build_src
          git checkout "$VERSION"
          
          # Executa script de build da receita
          eval "$BUILD_CMD"
          
          # Criação do control file para o equivs
          cat <<EOF1 > "${NAME}.control"
          Section: net
          Priority: optional
          Standards-Version: 3.9.2

          Package: ${NAME}
          Version: ${VERSION#v}
          Maintainer: Victor Oliveira <victor.oliveira@gmx.com>
          Architecture: amd64
          Depends: ${DEB_DEPENDS}
          Files:$(while read L; do D=${L%/*}; echo " ./prefix$L $D/"; done < install_manifest.txt)
          Description: ${DESC}
          EOF1

          DEB_BUILD_OPTIONS="nostrip nodwz" equivs-build "${NAME}.control"
          
          # Guarda o artefato para mover depois
          mkdir -p /tmp/debs
          cp *.deb /tmp/debs/

      - name: Checkout Repositório Debian
        uses: actions/checkout@v4
        with:
          repository: victor-oliveira1/debian_repo
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
          path: debian_repo

      - name: Atualizar Índices APT
        run: |
          apt-get install -y apt-utils dpkg-dev gzip
          cp /tmp/debs/*.deb debian_repo/deb/
          cd debian_repo
          dpkg-scanpackages . /dev/null > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

      - name: Commit no Repositório Debian
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: debian_repo
          token: ${{ secrets.DEBIAN_REPO_TOKEN }}
          commit_message: "chore: add ${{ needs.check.outputs.app_name }} package ${{ needs.check.outputs.version }}"
          file_pattern: 'deb/*.deb Packages* Release'

      - name: Atualizar arquivo de versão local
        run: |
          mkdir -p versions
          echo "${{ needs.check.outputs.version }}" > "versions/${{ needs.check.outputs.app_name }}.txt"

      - name: Commit arquivo de versão
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update ${{ needs.check.outputs.app_name }} version to ${{ needs.check.outputs.version }} [skip ci]"
          file_pattern: 'versions/*.txt'
